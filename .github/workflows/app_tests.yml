name: Annotator App CI

on:
  push:
    branches: [ developing, main ]
  pull_request:
    branches: [ developing, main ]

jobs:
  test:
    name: Run Desktop App Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Tkinter & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Module Imports
        run: |
          python -c "import annotator_agent; from annotator_agent import api_client, agent, local_cache; print('Annotator agent modules imported successfully')"

      - name: Run Pytest Suite under Virtual Framebuffer
        run: |
          xvfb-run -a pytest tests/ -v
